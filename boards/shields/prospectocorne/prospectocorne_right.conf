# ProspectoCorne right half (nice!nano v2). Halves only -- not used by the dongle.

# 128x32 OLED
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Per-key RGB (21 LEDs, see boards/nice_nano_nrf52840_zmk.overlay)
CONFIG_ZMK_RGB_UNDERGLOW=y

# Deep sleep after 15 min idle; any key wakes it
CONFIG_ZMK_SLEEP=y

# Eager debounce: press after 1 ms, release after 7 ms
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7
