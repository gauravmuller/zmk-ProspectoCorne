# Dongle screen (YADS) settings. Loaded last, so these win.
# All options: https://github.com/janpfischer/zmk-dongle-screen/tree/upgrade-4.1

# Show the dongle's own battery next to the two halves
CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y

# Screen + backlight off after 5 min without a keypress (0 = never)
CONFIG_DONGLE_SCREEN_IDLE_TIMEOUT_S=300

# Brightness 1-100 (adjust live with F23/F24, toggle screen with F22)
CONFIG_DONGLE_SCREEN_MAX_BRIGHTNESS=80
CONFIG_DONGLE_SCREEN_DEFAULT_BRIGHTNESS=60

# Orientation: horizontal by default; flip if it's upside down in the case
# CONFIG_DONGLE_SCREEN_HORIZONTAL=n
# CONFIG_DONGLE_SCREEN_FLIPPED=y

# Which OS icon to show for the GUI key: 0 macOS, 1 Linux, 2 Windows
CONFIG_DONGLE_SCREEN_SYSTEM_ICON=2

# Widgets (all on by default)
# CONFIG_DONGLE_SCREEN_WPM_ACTIVE=n
# CONFIG_DONGLE_SCREEN_MODIFIER_ACTIVE=n
