# ProspectoCorne -- settings shared by all three parts (both halves + dongle).
# Part-specific settings: boards/shields/prospectocorne/*.conf
# Dongle screen settings:  config/prospectocorne_dongle.conf

# Report battery level to the computer
CONFIG_ZMK_BATTERY_REPORTING=y

# Longer Bluetooth range (+8 dBm)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ZMK Studio: no unlock needed (Studio only runs on the dongle)
CONFIG_ZMK_STUDIO_LOCKING=n
