# ProspectoCorne build matrix (ZMK main). Firmware: Actions -> latest run -> Artifacts.
#
#   prospectocorne_dongle  -> Xiao BLE dongle (central, YADS screen, ZMK Studio)
#   prospectocorne_left    -> left half
#   prospectocorne_right   -> right half
#   settings_reset_*       -> clears pairings (use before first pairing / re-pairing)
---
include:
  - board: xiao_ble//zmk
    shield: prospectocorne_dongle dongle_screen
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: prospectocorne_dongle

  - board: nice_nano//zmk
    shield: prospectocorne_left
    artifact-name: prospectocorne_left

  - board: nice_nano//zmk
    shield: prospectocorne_right
    artifact-name: prospectocorne_right

  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: settings_reset_nice_nano
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: settings_reset_xiao_ble
